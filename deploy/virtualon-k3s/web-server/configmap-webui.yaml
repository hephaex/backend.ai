apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-ai-webui-config
  namespace: backend-ai
data:
  # config.toml is mounted at /usr/share/nginx/html/config.toml
  # backend.ai-webui reads this at startup to configure the manager endpoint
  config.toml: |
    [general]
    debug = false
    apiEndpoint = "http://192.168.29.110:30880"
    apiEndpointText = "VirtualOn Backend.AI"

    [wsproxy]
    url = "http://192.168.29.110:30200"

    [plugin]
    plugins = {}

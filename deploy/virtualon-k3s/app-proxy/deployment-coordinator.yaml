apiVersion: v1
kind: ConfigMap
metadata:
  name: appproxy-coordinator-entrypoint
  namespace: backend-ai
data:
  entrypoint.sh: |
    #!/usr/bin/env python3
    # Expand ${VAR} env vars in TOML before launching — python:3.13-slim has no envsubst
    import os, re, sys

    with open("/etc/backend.ai/proxy-coordinator.toml") as f:
        content = f.read()

    content = re.sub(r'\$\{([^}]+)\}', lambda m: os.environ.get(m.group(1), m.group(0)), content)

    with open("/tmp/coordinator.toml", "w") as f:
        f.write(content)

    os.execv(sys.executable, [sys.executable, "-m",
        "ai.backend.appproxy.coordinator.server", "-f", "/tmp/coordinator.toml"])
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-ai-appproxy-coordinator
  namespace: backend-ai
  labels:
    app: backend-ai-appproxy-coordinator
    component: app-proxy
    version: "26.4.3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-ai-appproxy-coordinator
  template:
    metadata:
      labels:
        app: backend-ai-appproxy-coordinator
        component: app-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
      - name: wait-postgres
        # postgres:16 pg_isready gives "no attempt" via TCP — use nc instead
        image: curlimages/curl:latest
        command: ["sh", "-c", "until nc -z postgres 5432; do sleep 2; done"]
      containers:
      - name: coordinator
        # local image built on VM110: pip install backend.ai-appproxy-coordinator==26.4.3
        # build: docker build -t bai-appproxy-coordinator:26.4.3 -f Dockerfile.coordinator .
        # import: docker save bai-appproxy-coordinator:26.4.3 | ctr -n k8s.io images import -
        image: bai-appproxy-coordinator:26.4.3
        imagePullPolicy: Never
        command: ["python3", "/entrypoint/entrypoint.sh"]
        ports:
        - containerPort: 10200
          name: coordinator
        env:
        - name: APPPROXY_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-ai-appproxy-secret
              key: postgres-password
        - name: BACKEND_AI_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-ai-appproxy-secret
              key: jwt-secret
        - name: BACKEND_AI_API_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-ai-appproxy-secret
              key: api-secret
        - name: PERMIT_HASH_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-ai-appproxy-secret
              key: permit-hash-secret
        volumeMounts:
        - name: config
          mountPath: /etc/backend.ai/proxy-coordinator.toml
          subPath: proxy-coordinator.toml
        - name: entrypoint
          mountPath: /entrypoint
        - name: ipc
          mountPath: /tmp/backend.ai/ipc
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 10200
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: appproxy-coordinator-config
      - name: entrypoint
        configMap:
          name: appproxy-coordinator-entrypoint
          defaultMode: 0755
      - name: ipc
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend-ai-appproxy-coordinator
  namespace: backend-ai
  labels:
    app: backend-ai-appproxy-coordinator
spec:
  type: NodePort
  selector:
    app: backend-ai-appproxy-coordinator
  ports:
  - name: coordinator
    port: 10200
    targetPort: 10200
    nodePort: 30200

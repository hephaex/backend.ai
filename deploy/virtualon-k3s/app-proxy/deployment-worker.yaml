apiVersion: v1
kind: ConfigMap
metadata:
  name: appproxy-worker-entrypoint
  namespace: backend-ai
data:
  entrypoint.sh: |
    #!/usr/bin/env python3
    # Expand ${VAR} env vars in TOML before launching — python:3.13-slim has no envsubst
    import os, re, sys

    with open("/etc/backend.ai/proxy-worker.toml") as f:
        content = f.read()

    content = re.sub(r'\$\{([^}]+)\}', lambda m: os.environ.get(m.group(1), m.group(0)), content)

    with open("/tmp/worker.toml", "w") as f:
        f.write(content)

    os.execv(sys.executable, [sys.executable, "-m",
        "ai.backend.appproxy.worker.server", "-f", "/tmp/worker.toml"])
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-ai-appproxy-worker
  namespace: backend-ai
  labels:
    app: backend-ai-appproxy-worker
    component: app-proxy
    version: "26.4.3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-ai-appproxy-worker
  template:
    metadata:
      labels:
        app: backend-ai-appproxy-worker
        component: app-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
      - name: wait-coordinator
        image: curlimages/curl:latest
        command:
        - "sh"
        - "-c"
        - "until curl -sf http://backend-ai-appproxy-coordinator:10200/health; do sleep 5; done"
      containers:
      - name: worker
        # local image built on VM110: pip install backend.ai-appproxy-worker==26.4.3
        # build: docker build -t bai-appproxy-worker:26.4.3 -f Dockerfile.worker .
        # import: docker save bai-appproxy-worker:26.4.3 | ctr -n k8s.io images import -
        image: bai-appproxy-worker:26.4.3
        imagePullPolicy: Never
        command: ["python3", "/entrypoint/entrypoint.sh"]
        ports:
        - containerPort: 10201
          name: worker
        env:
        - name: BACKEND_AI_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-ai-appproxy-secret
              key: jwt-secret
        - name: BACKEND_AI_API_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-ai-appproxy-secret
              key: api-secret
        - name: PERMIT_HASH_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-ai-appproxy-secret
              key: permit-hash-secret
        volumeMounts:
        - name: config
          mountPath: /etc/backend.ai/proxy-worker.toml
          subPath: proxy-worker.toml
        - name: entrypoint
          mountPath: /entrypoint
        - name: ipc
          mountPath: /tmp/backend.ai/ipc
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: config
        configMap:
          name: appproxy-worker-config
      - name: entrypoint
        configMap:
          name: appproxy-worker-entrypoint
          defaultMode: 0755
      - name: ipc
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend-ai-appproxy-worker
  namespace: backend-ai
  labels:
    app: backend-ai-appproxy-worker
spec:
  type: NodePort
  selector:
    app: backend-ai-appproxy-worker
  ports:
  - name: worker
    port: 10201
    targetPort: 10201
    nodePort: 30201

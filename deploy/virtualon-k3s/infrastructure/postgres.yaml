apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: backend-ai
data:
  init.sql: |
    CREATE DATABASE appproxy;
    CREATE USER appproxy WITH ENCRYPTED PASSWORD 'appproxy';
    GRANT ALL PRIVILEGES ON DATABASE appproxy TO appproxy;
    \connect appproxy
    GRANT ALL ON SCHEMA public TO appproxy;
    GRANT CREATE ON SCHEMA public TO appproxy;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: backend-ai
  labels:
    app: postgres
    component: infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16
        env:
        - name: POSTGRES_DB
          value: "postgres"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-ai-appproxy-secret
              key: postgres-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: init-sql
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: postgres-data
        emptyDir: {}
      - name: init-sql
        configMap:
          name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: backend-ai
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432

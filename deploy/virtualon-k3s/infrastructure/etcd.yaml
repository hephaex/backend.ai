apiVersion: apps/v1
kind: Deployment
metadata:
  name: etcd
  namespace: backend-ai
  labels:
    app: etcd
    component: infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
        component: infrastructure
    spec:
      containers:
      - name: etcd
        # Same image used by Kubernetes itself — widely cached, always available
        image: registry.k8s.io/etcd:3.5.13-0
        command:
        - etcd
        - --data-dir=/var/etcd/data
        - --listen-client-urls=http://0.0.0.0:2379
        - --advertise-client-urls=http://0.0.0.0:2379
        - --listen-peer-urls=http://0.0.0.0:2380
        - --initial-advertise-peer-urls=http://0.0.0.0:2380
        - --initial-cluster=default=http://0.0.0.0:2380
        - --initial-cluster-state=new
        - --initial-cluster-token=etcd-backend-ai
        ports:
        - containerPort: 2379
          name: client
        - containerPort: 2380
          name: peer
        env:
        - name: ETCDCTL_API
          value: "3"
        readinessProbe:
          exec:
            command:
            - etcdctl
            - --endpoints=http://127.0.0.1:2379
            - endpoint
            - health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: etcd-data
          mountPath: /var/etcd/data
      volumes:
      - name: etcd-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: backend-ai
  labels:
    app: etcd
spec:
  type: ClusterIP
  selector:
    app: etcd
  ports:
  - name: client
    port: 2379
    targetPort: 2379
  - name: peer
    port: 2380
    targetPort: 2380

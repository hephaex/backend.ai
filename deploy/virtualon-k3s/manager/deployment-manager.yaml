apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-ai-manager
  namespace: backend-ai
  labels:
    app: backend-ai-manager
    component: manager
    version: "26.4.3"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend-ai-manager
  template:
    metadata:
      labels:
        app: backend-ai-manager
        component: manager
    spec:
      securityContext:
        supplementalGroups: [999]
      containers:
      - name: manager
        # local image built on VM110 — see manager/Dockerfile.manager
        # docker build -t bai-manager:26.4.3 -f manager/Dockerfile.manager manager/
        # docker save bai-manager:26.4.3 | sudo ctr -n k8s.io images import -
        image: bai-manager:26.4.3
        imagePullPolicy: Never
        command:
        - python
        - -m
        - ai.backend.manager.server
        - -f
        - /etc/backend.ai/manager.toml
        ports:
        - containerPort: 8081
          name: http
        - containerPort: 18080
          name: internal
        env:
        - name: BACKEND_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-ai-appproxy-secret
              key: postgres-password
        volumeMounts:
        - name: manager-config
          mountPath: /etc/backend.ai/manager.toml
          subPath: manager.toml
        - name: manager-keypair
          mountPath: /var/run/backend.ai/fixtures/manager
          readOnly: true
        - name: docker-sock
          mountPath: /var/run/docker.sock
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      volumes:
      - name: manager-config
        configMap:
          name: backend-ai-manager-config
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
          type: Socket
      - name: manager-keypair
        secret:
          secretName: bai-manager-keypair
          items:
          - key: manager.key_secret
            path: manager.key_secret
          - key: manager.key
            path: manager.key
---
apiVersion: v1
kind: Service
metadata:
  name: backend-ai-manager
  namespace: backend-ai
  labels:
    app: backend-ai-manager
spec:
  type: NodePort
  selector:
    app: backend-ai-manager
  ports:
  - name: http
    port: 8081
    targetPort: 8081
    nodePort: 30880
  - name: internal
    port: 18080
    targetPort: 18080
